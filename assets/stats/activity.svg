<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-labelledby="title desc"><title id="title">GitHub activity status</title><desc id="desc">GitHub activity status — a personal developer-profile visualization.</desc><defs><radialGradient id="atmo"><stop stop-color="#0a3156" stop-opacity=".7"/><stop offset=".55" stop-color="#07111f" stop-opacity=".45"/><stop offset="1" stop-color="#02040a"/></radialGradient><linearGradient id="line" x2="1" y2="1"><stop stop-color="#50e6ff"/><stop offset="1" stop-color="#8a6cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h8" stroke="#9defff" stroke-opacity=".045"/></pattern></defs><rect width="100%" height="100%" rx="18" fill="url(#atmo)"/><rect width="100%" height="100%" rx="18" fill="url(#scan)"/><text x="45" y="60" fill="#75e9ff" font-family="monospace" font-size="14">GITHUB ACTIVITY // LIVE DATA PENDING</text><text x="45" y="115" fill="#dffaff" font-family="Inter,Arial" font-size="18">No authenticated public-data snapshot is available.</text><text x="45" y="150" fill="#88a9ba" font-family="monospace" font-size="12">The scheduled workflow refreshes this panel with GitHub API data.</text></svg>