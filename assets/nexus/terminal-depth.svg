<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">NEXUS profile terminal</title><desc id="desc">NEXUS profile terminal. The graphic has a readable static state when animation is unavailable.</desc>
<defs>
  <linearGradient id="face" x2="0" y2="1"><stop stop-color="#f5fdff"/><stop offset=".38" stop-color="#8cefff"/><stop offset="1" stop-color="#227da8"/></linearGradient>
  <linearGradient id="sweep" x1="0" x2="1"><stop stop-color="#7cefff" stop-opacity="0"/><stop offset=".5" stop-color="#e7ffff" stop-opacity=".85"/><stop offset="1" stop-color="#7cefff" stop-opacity="0"/></linearGradient>
  <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 .5H8" stroke="#bdefff" stroke-opacity=".025"/></pattern>
</defs>
<rect width="1200" height="370" rx="18" fill="#03070d"/><rect width="1200" height="370" rx="18" fill="url(#grain)"/><text x="62" y="54" fill="#7feeff" font-family="monospace" font-size="12" letter-spacing="3">07 // TERMINAL</text><path d="M110 95H1064l26 18v220H136l-26-18z" fill="#04111d" stroke="#14506d"/><path d="M110 95H1064v220H110z" fill="#06131f" stroke="#61e6f8" stroke-opacity=".72"/><path d="M128 116H1046" stroke="#ddffff" stroke-opacity=".36"/><text x="145" y="126" fill="#9befff" font-family="monospace" font-size="11">nexus@krishna:~$ system</text><text x="145" y="140" fill="#78eaff" font-family="monospace" font-size="13">profile    </text><text x="300" y="140" fill="#e3fbff" font-family="monospace" font-size="13">Krishna Sai Channalli</text><text x="145" y="178" fill="#78eaff" font-family="monospace" font-size="13">focus      </text><text x="300" y="178" fill="#e3fbff" font-family="monospace" font-size="13">AI / Agents / Automation</text><text x="145" y="216" fill="#78eaff" font-family="monospace" font-size="13">current    </text><text x="300" y="216" fill="#e3fbff" font-family="monospace" font-size="13">The-Opero</text><text x="145" y="254" fill="#78eaff" font-family="monospace" font-size="13">stack      </text><text x="300" y="254" fill="#e3fbff" font-family="monospace" font-size="13">Python / TypeScript / Rust</text><text x="145" y="292" fill="#78eaff" font-family="monospace" font-size="13">status     </text><text x="300" y="292" fill="#e3fbff" font-family="monospace" font-size="13">Ready</text><text x="145" y="310" fill="#8defff" font-family="monospace" font-size="13">nexus@krishna:~$</text><rect x="300" y="297" width="9" height="16" fill="#b9ffff"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect></svg>