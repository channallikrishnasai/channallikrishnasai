<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc"><title id="title">Mission Control</title><desc id="desc">Mission Control — a personal developer-profile visualization.</desc><defs><radialGradient id="atmo"><stop stop-color="#0a3156" stop-opacity=".7"/><stop offset=".55" stop-color="#07111f" stop-opacity=".45"/><stop offset="1" stop-color="#02040a"/></radialGradient><linearGradient id="line" x2="1" y2="1"><stop stop-color="#50e6ff"/><stop offset="1" stop-color="#8a6cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h8" stroke="#9defff" stroke-opacity=".045"/></pattern></defs><rect width="100%" height="100%" rx="18" fill="url(#atmo)"/><rect width="100%" height="100%" rx="18" fill="url(#scan)"/><text x="55" y="65" fill="#75e9ff" font-family="monospace" font-size="14" letter-spacing="3">MISSION CONTROL</text><rect x="45" y="90" width="810" height="110" rx="12" fill="#05101d" stroke="#23698e"/><text x="70" y="140" fill="#e5fbff" font-family="Inter,Arial" font-size="18">MISSION QUEUE AWAITING VERIFIED PROJECT DATA</text><text x="70" y="172" fill="#88a9ba" font-family="monospace" font-size="12">Add public repositories to config/profile.json, then regenerate.</text></svg>