tegration, local execution modules, dashboard, plugins, and WhatsApp bridge</text><circle cx="1080" cy="159" r="6" fill="#74edc0"><animate attributeName="opacity" values=".45;1;.45" dur="3.0s" repeatCount="indefinite"/></circle></g></a><a href="https://github.com/channallikrishnasai/vaultiq-ai"><g><path d="M78 295H1122" stroke="#63eaff" stroke-opacity=".24"/><text x="100" y="270" fill="#7cefff" font-family="monospace" font-size="11">02</text><text x="160" y="270" fill="#f0feff" font-family="IBM Plex Mono,JetBrains Mono,monospace" font-size="16" text-anchor="start" letter-spacing="0">VaultIQ AI</text><text x="460" y="270" fill="#bed8e2" font-family="IBM Plex Mono,JetBrains Mono,monospace" font-size="11" text-anchor="start" letter-spacing="0">AI-powered personal-finance platform for budgeting, investing, fraud protection, goals, and scenario planning.</text><text x="460" y="292" fill="#86aaba" font-family="IBM Plex Mono,JetBrains Mono,monospace" font-size="10" text-anchor="start" letter-spacing="0">Next</text><circle cx="1080" cy="264" r="6" fill="#74edc0"><animate attributeName="opacity" values=".45;1;.45" dur="3.8s" repeatCount="indefinite"/></circle></g></a><a href="https://github.com/channallikrishnasai/LifeOS-AI"><g><path d="M78 400H1122" stroke="#63eaff" stroke-opacity=".24"/><text x="100" y="375" fill="#7cefff" font-family="monospace" font-size="11">03</text><text x="160" y="375" fill="#f0feff" font-family="IBM Plex Mono,JetBrains Mono,monospace" font-size="16" text-anchor="start" letter-spacing="0">LifeOS AI</text><text x="460" y="375" fill="#bed8e2" font-family="IBM Plex Mono,JetBrains Mono,monospace" font-size="11" text-anchor="start" letter-spacing="0">AI life-management platform for projects, goals, habits, learning, and startup planning.</text><text x="460" y="397" fill="#86aaba" font-family="IBM Plex Mono,JetBrains Mono,monospace" font-size="10" text-anchor="start" letter-spacing="0">FastAPI, React, PostgreSQL, Redis, WebSockets, and specialized AI agents</text><circle cx="1080" cy="369" r="6" fill="#74edc0"><animate attributeName="opacity" values=".45;1;.45" dur="4.6s" repeatCount="indefinite"/></circle></g></a><a href="https://github.com/channallikrishnasai/PRISM"><g><path d="M78 505H1122" stroke="#63eaff" stroke-opacity=".24"/><text x="100" y="480" fill="#7cefff" font-family="monospace" font-size="11">04</text><text x="160" y="480" fill="#f0feff" font-family="IBM Plex Mono,JetBrains Mono,monospace" font-size="16" text-anchor="start" letter-spacing="0">PRISM / Entire Graph</text><text x="460" y="480" fill="#bed8e2" font-family="IBM Plex Mono,JetBrains Mono,monospace" font-size="11" text-anchor="start" letter-spacing="0">A coding-agent plugin for local repository maps, ranked code search, and change-impact navigation.</text><text x="460" y="502" fill="#86aaba" font-family="IBM Plex Mono,JetBrains Mono,monospace" font-size="10" text-anchor="start" letter-spacing="0">Go, tree-sitter-based analysis, local indexing, and CLI plugin architecture</text><circle cx="1080" cy="474" r="6" fill="#74edc0"><animate attributeName="opacity" values=".45;1;.45" dur="5.4s" repeatCount="indefinite"/></circle></g></a></g></svg>