<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-labelledby="title desc"><title id="title">Contribution matrix awaiting verified GitHub data</title><desc id="desc">Contribution matrix awaiting verified GitHub data — a personal developer-profile visualization.</desc><defs><radialGradient id="atmo"><stop stop-color="#0a3156" stop-opacity=".7"/><stop offset=".55" stop-color="#07111f" stop-opacity=".45"/><stop offset="1" stop-color="#02040a"/></radialGradient><linearGradient id="line" x2="1" y2="1"><stop stop-color="#50e6ff"/><stop offset="1" stop-color="#8a6cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h8" stroke="#9defff" stroke-opacity=".045"/></pattern></defs><rect width="100%" height="100%" rx="18" fill="url(#atmo)"/><rect width="100%" height="100%" rx="18" fill="url(#scan)"/><text x="45" y="40" fill="#75e9ff" font-family="monospace" font-size="13">CONTRIBUTION MATRIX // DATA-SAFE MODE</text><text x="45" y="92" fill="#dffaff" font-family="Inter,Arial" font-size="16">No contribution data has been fetched.</text><text x="45" y="125" fill="#88a9ba" font-family="monospace" font-size="11">The scheduled workflow uses GitHub GraphQL to render actual contribution counts.</text></svg>