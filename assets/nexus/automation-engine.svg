<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Automation engine</title><desc id="desc">Automation engine. Animated NEXUS visual with a readable static state.</desc><defs><radialGradient id="space"><stop stop-color="#10395e"/><stop offset=".43" stop-color="#071625"/><stop offset="1" stop-color="#02040a"/></radialGradient><radialGradient id="core"><stop stop-color="#fff"/><stop offset=".16" stop-color="#b5faff"/><stop offset=".45" stop-color="#39c8eb"/><stop offset="1" stop-color="#152e67" stop-opacity=".08"/></radialGradient><linearGradient id="beam"><stop stop-color="#54edff" stop-opacity="0"/><stop offset=".5" stop-color="#c1fcff"/><stop offset="1" stop-color="#9579ff" stop-opacity="0"/></linearGradient><filter id="bloom" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 .5H6" stroke="#b3f6ff" stroke-opacity=".035"/></pattern><clipPath id="clip"><rect width="100%" height="100%" rx="18"/></clipPath></defs><g clip-path="url(#clip)"><rect width="100%" height="100%" fill="url(#space)"/><rect width="100%" height="100%" fill="url(#scan)"/><circle cx="17" cy="19" r="1.0" fill="#d7fbff" opacity=".2"><animate attributeName="opacity" values=".15;0.45;.15" dur="5s" repeatCount="indefinite"/></circle><circle cx="90" cy="66" r="1.4" fill="#d7fbff" opacity=".3"><animate attributeName="opacity" values=".15;0.65;.15" dur="6s" repeatCount="indefinite"/></circle><circle cx="163" cy="113" r="1.7" fill="#d7fbff" opacity=".4"><animate attributeName="opacity" values=".15;0.85;.15" dur="7s" repeatCount="indefinite"/></circle><circle cx="236" cy="160" r="1.0" fill="#d7fbff" opacity=".5"><animate attributeName="opacity" values=".15;0.45;.15" dur="8s" repeatCount="indefinite"/></circle><circ